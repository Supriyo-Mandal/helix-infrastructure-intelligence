project: HELIX

environment:
  os: ubuntu-24.04

languages:
  go:
    version: "1.25"

  python:
    version: "3.12"

  node:
    version: "22"

package_managers:
  python: uv
  node: npm
  go: go-modules

containerization:
  docker:
    required: true

  docker_compose:
    required: true

kubernetes:
  distribution: kind
  kubectl:
    required: true
  helm:
    required: true

database:
  postgresql: "16"

infrastructure:
  iac: opentofu

observability:
  prometheus:
    required: true

  opentelemetry:
    required: true

development:
  ide: vscode
  source_control: git